services:
  codex-pool:
    environment:
      PUBLIC_URL: https://${POOL_DOMAIN:?Set POOL_DOMAIN in .env}
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:?Set TRAEFIK_NETWORK in .env}
      - traefik.http.routers.codex-pool.rule=Host(`${POOL_DOMAIN:?Set POOL_DOMAIN in .env}`)
      - traefik.http.routers.codex-pool.entrypoints=${TRAEFIK_ENTRYPOINT:?Set TRAEFIK_ENTRYPOINT in .env}
      - traefik.http.routers.codex-pool.tls=true
      - traefik.http.routers.codex-pool.tls.certresolver=${TRAEFIK_CERTRESOLVER:?Set TRAEFIK_CERTRESOLVER in .env}
      - traefik.http.services.codex-pool.loadbalancer.server.port=8989

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:?Set TRAEFIK_NETWORK in .env}
