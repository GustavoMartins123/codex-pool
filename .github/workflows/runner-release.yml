name: Runner release

on:
  push:
    tags:
      - "runner-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.26.8"
          cache: true
      - name: Build and package runner binaries
        run: bash scripts/build-runner-release.sh "$RUNNER_TEMP/runner-release"
      - name: Verify runner binaries
        run: sha256sum -c "$RUNNER_TEMP/runner-release/SHA256SUMS"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Runner $TAG" --generate-notes
          fi
          gh release upload "$TAG" "$RUNNER_TEMP"/runner-release/* --clobber
