name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web frontend (embedded assets)
        run: |
          cd web
          npm ci
          npm run build

      - name: Test web (vitest)
        run: |
          cd web
          npm test

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race -count=1 ./...

      # Structural check of the benchmark harness and the versioned baseline:
      # the runner executes every scenario and the comparator is proven to flag
      # a real regression. It does NOT gate performance -- the committed
      # baseline was recorded in mock mode, so it carries no timing signal.
      # Re-record it with `go run ./bench/runner -save-baseline` against a real
      # target before treating a comparison as a perf gate.
      - name: Bench harness and baseline integrity
        run: go test -count=1 -v ./bench/runner/
