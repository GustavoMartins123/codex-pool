services:
  codex-pool:
    image: codex-pool:verify
    environment:
      POOL_DIR: /app/pool
      PROXY_DB_PATH: /app/data/proxy.db
      DUCKDB_PATH: /app/data/usage.duckdb
      PROXY_LISTEN_ADDR: 0.0.0.0:8989
      PROXY_DISABLE_REFRESH: "true"
      POOL_JWT_SECRET: ${VERIFY_JWT_SECRET:?verification key required}
      POOL_AUTH_ENCRYPTION_KEY: ${VERIFY_AUTH_KEY:?verification key required}
      POOL_CREDENTIAL_KEY: ${VERIFY_VAULT_KEY:?verification key required}
      POOL_CREDENTIAL_KEY_VERSION: ${VERIFY_VAULT_VERSION:?verification version required}
      POOL_CREDENTIAL_KEY_PREVIOUS: ${VERIFY_VAULT_PREVIOUS-}
      POOL_CREDENTIAL_KEY_PREVIOUS_VERSION: "1"
      ADMIN_TOKEN: ${VERIFY_ADMIN_TOKEN:?verification key required}
      PROXY_USAGE_REFRESH_SECONDS: "86400"
    volumes:
      - data:/app/data
      - pool:/app/pool
    cap_drop: [ALL]
    mem_limit: 2g
    networks: [isolated]
    healthcheck:
      test: [CMD, curl, -fsS, "http://127.0.0.1:8989/healthz"]
      interval: 2s
      timeout: 3s
      start_period: 5s
      retries: 15

networks:
  isolated:
    internal: true
volumes:
  data:
  pool:
