services:
  codex-pool:
    build: .
    image: codex-pool:latest
    container_name: codex-pool
    ports:
      - "8989:8989"
    volumes:
      - ./pool:/app/pool
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - POOL_DIR=/app/pool
      - PROXY_DB_PATH=/app/data/proxy.db
      - DUCKDB_PATH=/app/data/usage.duckdb
      - DUCKDB_MEMORY_LIMIT=${DUCKDB_MEMORY_LIMIT:-512MB}
      - PROXY_LISTEN_ADDR=0.0.0.0:8989
      - PROXY_MAX_ATTEMPTS=3
      - PROXY_USAGE_REFRESH_SECONDS=300
      - PROXY_EXHAUSTION_WAIT_SECONDS=${PROXY_EXHAUSTION_WAIT_SECONDS:-900}
      - PROXY_EXHAUSTION_PREFER_WAIT=${PROXY_EXHAUSTION_PREFER_WAIT:-true}
    cap_drop:
      - ALL
    mem_limit: 2g
    memswap_limit: 2g
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 512m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8989/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
